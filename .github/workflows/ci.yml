name: AERIS CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AERIS/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q analysis app connectors scripts tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Export OpenAPI
        run: python scripts/export_openapi.py

  frontend:
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: AERIS/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: AERIS/frontend/package-lock.json
      - name: Install frontend
        run: npm ci
      - name: Install backend schema dependencies
        working-directory: AERIS/backend
        run: python -m pip install -e .
      - name: Generate API types
        run: npm run generate:api
      - name: Verify generated contracts are current
        run: git diff --exit-code -- ../backend/openapi.json src/generated/api.ts src/generated/release.ts
      - name: Frontend unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Lint
        run: npm run lint
