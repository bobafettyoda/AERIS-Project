[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aeris-backend"
version = "0.6.1"
description = "AERIS Maryland geospatial screening and parcel diligence backend"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.128,<1",
  "geopandas>=1.1,<2",
  "numpy>=2.2,<3",
  "pandas>=2.2,<4",
  "pydantic>=2.10,<3",
  "pyogrio>=0.11,<1",
  "pyproj>=3.7,<4",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6,<7",
  "requests>=2.32,<3",
  "shapely>=2.1,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["analysis*", "app*", "connectors*"]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
