metadata:
  title: Maryland Data Center Siting Demo
  version: 0.1
  author: AERIS
  methodology:
    - GIS-MCDA
    - Analytic Hierarchy Process (AHP)
    - Weighted Linear Combination (WLC)
  reference: >
    GIS-Driven Regional Assessment for Sustainable Data Center Siting
name: data_center_maryland_demo

study_area:
  state: Maryland
  county: Prince George's

analysis:
  type: GIS-MCDA
  weighting: AHP
  overlay: WLC
  grid_resolution_m: 100

criteria:
  climate:
    weight: 0.250

  grid_infrastructure:
    weight: 0.154

  telecom_infrastructure:
    weight: 0.154

  protected_areas:
    weight: 0.154

  water_bodies:
    weight: 0.0847

  population_density:
    weight: 0.0847

  road_access:
    weight: 0.0795

  hydro_hazard:
    weight: 0.0390

hard_exclusions:
  - flood_zones
  - wetlands
  - protected_areas

preferred_distances:
  substation_m: 4000
  transmission_line_m: 4000
  road_m: 800

output:
  suitability_scale: 0-1
  rank_candidates: true

population_density_scoring:
  method: local_tract_provisional
  description: >
    Uses the population density of the census tract containing the
    candidate point. Neighboring tracts are not yet included.
  acs_year: 2024
  units: people_per_sq_km
  points:
    - density: 0
      score: 0.30
    - density: 250
      score: 0.30
    - density: 1000
      score: 0.80
    - density: 3000
      score: 1.00
    - density: 6000
      score: 0.50
    - density: 12000
      score: 0.20

telecom_infrastructure_scoring:
  method: public_fiber_coverage_proxy
  description: >
    Uses reported fiber service coverage as a public-data proxy for
    telecom accessibility. It does not verify physical cable routes,
    available enterprise capacity, latency, or route diversity.

  proximity_component_weight: 0.70
  diversity_component_weight: 0.30
  diversity_search_radius_m: 5000

  proximity_scores:
    direct_coverage: 1.00
    within_500_m: 0.90
    within_1000_m: 0.80
    within_2000_m: 0.65
    within_5000_m: 0.40
    beyond_5000_m: 0.10

  provider_diversity_scores:
    zero_providers: 0.00
    one_provider: 0.30
    two_providers: 0.55
    three_providers: 0.75
    four_or_more_providers: 1.00

  limitations:
    - Reported coverage does not identify the exact physical fiber route.
    - Multiple providers do not guarantee physically independent routes.
    - Enterprise capacity and service-level agreements require provider verification.

climate_scoring:
  method: nasa_power_temperature_proxy
  description: >
    Uses NASA POWER climatology at the candidate coordinate as a
    screening proxy for data-center cooling burden. The score combines
    annual mean temperature and July mean temperature. Humidity and
    climatological extremes are reported but are not scored in this version.

  annual_temperature_component_weight: 0.60
  july_temperature_component_weight: 0.40

  annual_mean_temperature_points:
    - temperature_c: 8
      score: 1.00
    - temperature_c: 12
      score: 0.90
    - temperature_c: 16
      score: 0.70
    - temperature_c: 20
      score: 0.40
    - temperature_c: 24
      score: 0.10

  july_mean_temperature_points:
    - temperature_c: 18
      score: 1.00
    - temperature_c: 22
      score: 0.85
    - temperature_c: 26
      score: 0.65
    - temperature_c: 30
      score: 0.35
    - temperature_c: 34
      score: 0.10

  limitations:
    - NASA POWER values are regional climatology estimates, not parcel-level weather observations.
    - Relative humidity is reported but is not included in the first scoring method.
    - Final cooling-system design requires engineering-grade weather analysis.
