    https://planning.maryland.gov/Pages/OurWork/PBP/local-gov-plng/LocalPlanningByCounty.aspx

  comprehensive_plan_directory: >-
    https://planning.maryland.gov/Pages/OurWork/PBP/compplans/viewplans.aspx

  legal_authority_reference: >-
    https://planning.maryland.gov/Pages/OurWork/PBP/compplans/Legal.aspx

status_vocabulary:
  - AVAILABLE
  - STATEWIDE_BASELINE_ONLY
  - PARTIAL
  - SOURCE_DISCOVERY_REQUIRED
  - MANUAL_REVIEW_REQUIRED
  - DATA_UNAVAILABLE
  - ERROR

default_local_sources:
  zoning:
    status: STATEWIDE_BASELINE_ONLY
    adapter: null
    endpoint: null
    authoritative_local_geometry: false
    note: >-
      Statewide parcel zoning is available. Local authoritative
      zoning geometry has not yet been configured.

  comprehensive_plan:
    status: MANUAL_REVIEW_REQUIRED
    adapter: null
    endpoint: null
    note: >-
      Current comprehensive-plan documents require local verification.

  active_development:
    status: SOURCE_DISCOVERY_REQUIRED
    adapter: null
    endpoint: null
    note: >-
      Active development applications and approved plans vary by
      jurisdiction and require a configured local source.

  permits:
    status: SOURCE_DISCOVERY_REQUIRED
    adapter: null
    endpoint: null
    note: >-
      Permit systems vary by jurisdiction and are not assumed absent
      when automation is unavailable.

